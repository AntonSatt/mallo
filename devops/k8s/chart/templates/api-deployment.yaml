{{- $component := "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gr8.fullname" (dict "Release" .Release "component" $component) }}
  labels:
    {{- include "gr8.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "gr8.selectorLabels" (dict "Release" .Release "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gr8.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        # Forces a rollout on every helm upgrade even when image:tag is unchanged
        # (e.g., develop pushes that just rebuild the same :develop tag).
        gr8.k3s/release-revision: {{ .Release.Revision | quote }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      containers:
        - name: api
          image: {{ include "gr8.image" (dict "Values" .Values "component" $component) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.api.port }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: DB_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: {{ include "gr8.dbConnectionString" . | quote }}
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: Cors__AllowedOrigins__0
              value: "https://{{ include "gr8.host" . }}"
            - name: Cors__AllowedOrigins__1
              value: "http://localhost:5173"
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
                optional: false
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # API waits on DB + applies EF migrations on first start, so initial boot can be slow.
          # startupProbe gives it a generous window; liveness/readiness run normally once it's up.
          startupProbe:
            tcpSocket:
              port: {{ .Values.api.port }}
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: {{ .Values.api.port }}
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: {{ .Values.api.port }}
            periodSeconds: 10
