apiVersion: apps/v1
kind: Deployment
metadata:
  name: gr8-plain-api
  labels:
    app.kubernetes.io/name: gr8
    app.kubernetes.io/instance: gr8-plain
    app.kubernetes.io/part-of: gr8
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gr8
      app.kubernetes.io/instance: gr8-plain
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gr8
        app.kubernetes.io/instance: gr8-plain
        app.kubernetes.io/part-of: gr8
        app.kubernetes.io/component: api
      annotations:
        gr8.k3s/release-revision: "1"
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: api
          image: registry.chas-lab.dev/chas-challenge-2026/grupp-8/project/backend:develop
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            # DB_PASSWORD must be defined before ConnectionStrings so the
            # $(DB_PASSWORD) reference below resolves (k8s env interpolation).
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gr8-secrets
                  key: DB_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: "Server=gr8-plain-db;Database=CommunityDB;User Id=sa;Password=$(DB_PASSWORD);TrustServerCertificate=true"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: Cors__AllowedOrigins__0
              value: "https://gr8-plain.cc.k3s.chas-lab.dev"
            - name: Cors__AllowedOrigins__1
              value: "http://localhost:5173"
          envFrom:
            - secretRef:
                name: gr8-secrets
                optional: false
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # API waits for the DB to come up (a cold PVC includes the MSSQL schema
          # upgrade, ~3-4 min) then runs EF migrations. 600s (60 x 10s) covers
          # the worst-case cold deploy before liveness starts killing the pod.
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
