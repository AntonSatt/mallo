stages:
  - test
  - secret-detection
  - build
  - deploy
  - cleanup

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

# Only develop can be merged into main
check-merge-source:
  stage: test
  script:
    - |
      if [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" == "main" ] && [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "develop" ]; then
        echo "ERROR: Only develop can merge into main"
        exit 1
      fi
      echo "Merge source check passed"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# Test stage: Frontend tests and coverage
# ---------------------------------------------------------------------------
frontend-test:
  stage: test
  image: node:20
  allow_failure: true
  script:
    - cd frontend/Gr8
    - echo "WARNING - No test scripts found in frontend package.json"
    - echo "Pipeline configured for testing, but waiting for Devs to implement Jest/Vitest."

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"

# ---------------------------------------------------------------------------
# Build stage: build images, push to GitLab Container Registry with buildx cache
# ---------------------------------------------------------------------------

.build-image: &build-image
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  before_script:
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker buildx create --use --name builder --driver docker-container || true
  rules:
    - if: $CI_COMMIT_BRANCH

build frontend:
  <<: *build-image
  script:
    - |
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then TAG=latest; else TAG=$CI_COMMIT_REF_SLUG; fi
      docker buildx build \
        -f frontend/Gr8/Dockerfile \
        -t "$CI_REGISTRY_IMAGE/frontend:$TAG" \
        --build-arg VITE_API_BASE_URL="https://api.gr8-${CI_COMMIT_REF_SLUG}.doe25.swarm.chas-lab.dev" \
        --cache-from=type=registry,ref="$CI_REGISTRY_IMAGE/frontend:cache-$TAG" \
        --cache-from=type=registry,ref="$CI_REGISTRY_IMAGE/frontend:cache-latest" \
        --cache-to=type=registry,ref="$CI_REGISTRY_IMAGE/frontend:cache-$TAG",mode=max \
        --provenance=false --push frontend/Gr8

build backend:
  <<: *build-image
  script:
    - |
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then TAG=latest; else TAG=$CI_COMMIT_REF_SLUG; fi
      docker buildx build \
        -f backend/Gr8/Dockerfile \
        -t "$CI_REGISTRY_IMAGE/backend:$TAG" \
        --cache-from=type=registry,ref="$CI_REGISTRY_IMAGE/backend:cache-$TAG" \
        --cache-from=type=registry,ref="$CI_REGISTRY_IMAGE/backend:cache-latest" \
        --cache-to=type=registry,ref="$CI_REGISTRY_IMAGE/backend:cache-$TAG",mode=max \
        --provenance=false --push backend/Gr8

build python-utils:
  <<: *build-image
  script:
    - docker buildx build -t "$CI_REGISTRY_IMAGE/python-utils:latest" --push devops/scripts
  rules:
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Deploy stage
# ---------------------------------------------------------------------------

# Develop deploy: persistent shared dev environment
deploy develop:
  stage: deploy
  image: $CI_REGISTRY_IMAGE/python-utils:latest
  needs:
    - job: build frontend
    - job: build backend
    - job: build python-utils
      optional: true
  environment:
    name: develop
    url: https://gr8-$CI_COMMIT_REF_SLUG.doe25.swarm.chas-lab.dev
  script:
    - cd devops/scripts
    - python deploy.py
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# Review deploy: ephemeral per-branch stacks for feature branches
deploy review:
  stage: deploy
  image: $CI_REGISTRY_IMAGE/python-utils:latest
  needs:
    - job: build frontend
    - job: build backend
    - job: build python-utils
      optional: true
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://gr8-$CI_COMMIT_REF_SLUG.doe25.swarm.chas-lab.dev
    on_stop: stop_review
  script:
    - cd devops/scripts
    - python deploy.py
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH != "develop"

# Production deploy: only on main, manual approval gate
deploy production:
  stage: deploy
  image: $CI_REGISTRY_IMAGE/python-utils:latest
  needs:
    - job: build frontend
    - job: build backend
    - job: build python-utils
      optional: true
  environment:
    name: production
    url: https://gr8-main.doe25.swarm.chas-lab.dev
  script:
    - cd devops/scripts
    - python deploy.py
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# ---------------------------------------------------------------------------
# Cleanup: manual stack teardown for review environments
# ---------------------------------------------------------------------------

stop_review:
  stage: cleanup
  image: $CI_REGISTRY_IMAGE/python-utils:latest
  variables:
    GIT_STRATEGY: none
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  script:
    - python /app/delete-stack.py
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH != "develop"
      when: manual
