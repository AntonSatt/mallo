# Chart now contains only resources Anton doesn't own:
#   - Bitnami Redis (sub-chart dependency declared in Chart.yaml)
#   - 3 observability resources (ServiceMonitor, PrometheusRule, Grafana dashboard ConfigMap)
# api/frontend/db/ingress/middleware live in ../manifests/ as plain YAML.

# --- REDIS CONFIGURATION ---
redis:
  enabled: true
  architecture: standalone

  image:
    registry: docker.io
    repository: bitnami/redis
    tag: "latest"
    pullPolicy: Always

  serviceAccount:
    create: false
  rbac:
    create: false

  master:
    persistence:
      enabled: true
      size: 1Gi
      storageClass: longhorn
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  auth:
    enabled: true
    existingSecret: gr8-secrets
    existingSecretPasswordKey: REDIS_PASSWORD

  service:
    ports:
      redis: 6379

  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
