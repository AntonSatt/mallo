stages:
  - test
  - secret-detection
  - build
  - deploy
  - smoke-test
  - cleanup

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

# Ensure exactly one pipeline per commit:
# - When an MR is open, run only the merge-request pipeline (so deploy + smoke-test
#   are part of the gate that blocks the merge button on failure).
# - When no MR is open, run the branch pipeline (so pre-MR feature pushes still
#   get a review env deployed).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  NAMESPACE: doe25-group-8
  HOST_BASE: cc.k3s.chas-lab.dev

# Only develop can be merged into main
check-merge-source:
  stage: test
  script:
    - |
      if [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" == "main" ] && [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "develop" ]; then
        echo "ERROR: Only develop can merge into main"
        exit 1
      fi
      echo "Merge source check passed"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# Test stage: Frontend tests and coverage
# ---------------------------------------------------------------------------
frontend-test:
  stage: test
  image: node:20
  script:
    - cd frontend/Gr8
    - echo "WARNING - No test scripts found in frontend package.json"
    - echo "Pipeline configured for testing, but waiting for Devs to implement Jest/Vitest."

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"

# ---------------------------------------------------------------------------
# Test stage: Backend tests and coverage
# ---------------------------------------------------------------------------
backend-test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - cd backend/Gr8
    - echo "WARNING - No test projects found in backend."
    - echo "Pipeline configured for testing, but waiting for Devs to implement xUnit/NUnit tests."

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"

# ---------------------------------------------------------------------------
# Build stage: build images, push to GitLab Container Registry with buildx cache
# ---------------------------------------------------------------------------

.build-image: &build-image
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  before_script:
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker buildx create --use --name builder --driver docker-container || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build frontend:
  <<: *build-image
  script:
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then TAG=latest; else TAG=$CI_COMMIT_REF_SLUG; fi
      docker buildx build \
        -f frontend/Gr8/Dockerfile \
        -t "$CI_REGISTRY_IMAGE/frontend:$TAG" \
        --build-arg VITE_API_BASE_URL="/api" \
        --cache-from=type=registry,ref="$CI_REGISTRY_IMAGE/frontend:cache-$TAG" \
        --cache-from=type=registry,ref="$CI_REGISTRY_IMAGE/frontend:cache-latest" \
        --cache-to=type=registry,ref="$CI_REGISTRY_IMAGE/frontend:cache-$TAG",mode=max \
        --provenance=false --push frontend/Gr8

build backend:
  <<: *build-image
  script:
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then TAG=latest; else TAG=$CI_COMMIT_REF_SLUG; fi
      docker buildx build \
        -f backend/Gr8/Dockerfile \
        -t "$CI_REGISTRY_IMAGE/backend:$TAG" \
        --cache-from=type=registry,ref="$CI_REGISTRY_IMAGE/backend:cache-$TAG" \
        --cache-from=type=registry,ref="$CI_REGISTRY_IMAGE/backend:cache-latest" \
        --cache-to=type=registry,ref="$CI_REGISTRY_IMAGE/backend:cache-$TAG",mode=max \
        --provenance=false --push backend/Gr8

# ---------------------------------------------------------------------------
# Deploy stage: helm upgrade --install per branch into the school k3s namespace.
# Auth via KUBECONFIG_CHAS_LAB (File-type CI variable holding the kubeconfig).
# ---------------------------------------------------------------------------

.deploy-k3s: &deploy-k3s
  stage: deploy
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  before_script:
    - apk add --no-cache curl bash coreutils
    - curl -LO "https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - echo "$KUBECONFIG_CC_PROJECT_B64" | base64 -d > /tmp/kubeconfig
    - chmod 600 /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - kubectl auth whoami

# Develop deploy: persistent shared dev environment
deploy develop:
  <<: *deploy-k3s
  needs:
    - job: build frontend
    - job: build backend
  environment:
    name: develop
    url: https://gr8-develop.${HOST_BASE}
  script:
    - |
      helm upgrade --install gr8-develop ./devops/k8s/chart \
        --namespace "$NAMESPACE" \
        --set image.tag=develop \
        --wait --timeout 20m --atomic
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# Review deploy: ephemeral per-branch releases for feature branches
deploy review:
  <<: *deploy-k3s
  needs:
    - job: build frontend
    - job: build backend
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://gr8-$CI_COMMIT_REF_SLUG.${HOST_BASE}
    on_stop: stop_review
  script:
    - |
      helm upgrade --install "gr8-$CI_COMMIT_REF_SLUG" ./devops/k8s/chart \
        --namespace "$NAMESPACE" \
        -f ./devops/k8s/chart/values-feature.yaml \
        --set image.tag="$CI_COMMIT_REF_SLUG" \
        --wait --timeout 20m --atomic
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "main"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "develop"

# Production deploy: only on main, manual approval gate
deploy production:
  <<: *deploy-k3s
  needs:
    - job: build frontend
    - job: build backend
  environment:
    name: production
    url: https://gr8-main.${HOST_BASE}
  script:
    - |
      helm upgrade --install gr8-main ./devops/k8s/chart \
        --namespace "$NAMESPACE" \
        --set image.tag=latest \
        --wait --timeout 20m --atomic
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# ---------------------------------------------------------------------------
# Smoke test: verify the deployed api actually responds.
# If the api boots, the database was reachable and migrations applied —
# so a green smoke test proves the full DB + app startup path end-to-end.
# Treats "any HTTP response from the app" as success (200, 404, etc.) so
# the check works regardless of ASPNETCORE_ENVIRONMENT. Only Traefik
# gateway errors (502/503/504) and connection failures count as down.
# ---------------------------------------------------------------------------

.smoke-test: &smoke-test
  stage: smoke-test
  image: curlimages/curl:latest
  script:
    - |
      URL="https://gr8-${CI_COMMIT_REF_SLUG}.${HOST_BASE}/api/openapi/v1.json"
      echo "Polling $URL"
      for i in $(seq 1 30); do
        status=$(curl -o /dev/null -s -w "%{http_code}" --max-time 5 "$URL" || echo "000")
        case "$status" in
          000|502|503|504)
            echo "attempt $i: app not responding (status $status)"
            sleep 5
            ;;
          *)
            echo "API up (HTTP $status) — DB + migrations + boot OK"
            exit 0
            ;;
        esac
      done
      echo "API never responded within 150s — check api/db logs with kubectl"
      exit 1

smoke-test develop:
  <<: *smoke-test
  needs:
    - job: deploy develop
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

smoke-test review:
  <<: *smoke-test
  needs:
    - job: deploy review
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "main"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "develop"

smoke-test production:
  <<: *smoke-test
  needs:
    - job: deploy production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Cleanup: manual teardown for review releases on MR close.
# Deletes the helm release AND the StatefulSet PVCs (helm uninstall doesn't).
# ---------------------------------------------------------------------------

stop_review:
  stage: cleanup
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl bash coreutils
    - curl -LO "https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - echo "$KUBECONFIG_CC_PROJECT_B64" | base64 -d > /tmp/kubeconfig
    - chmod 600 /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  script:
    - helm uninstall "gr8-$CI_COMMIT_REF_SLUG" -n "$NAMESPACE" || true
    - kubectl delete pvc -l app.kubernetes.io/instance="gr8-$CI_COMMIT_REF_SLUG" -n "$NAMESPACE" --ignore-not-found
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "main"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "develop"
      when: manual
      allow_failure: true
