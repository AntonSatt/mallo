services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    networks:
      - internal
    volumes:
      - sqlserver-data:/var/opt/mssql
    deploy:
      mode: replicated
      replicas: 1

  api:
    image: ${CI_REGISTRY_IMAGE}/backend:${image_tag}
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=Gr8;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=true
    networks:
      - internal
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.constraint-label=traefik-public"
        - "traefik.swarm.network=traefik-public"

        - "traefik.http.routers.${stack_name}-api-http.rule=Host(`api.${stack_name}.doe25.swarm.chas-lab.dev`)"
        - "traefik.http.routers.${stack_name}-api-http.entrypoints=http"
        - "traefik.http.routers.${stack_name}-api-http.middlewares=https-redirect"

        - "traefik.http.routers.${stack_name}-api-https.rule=Host(`api.${stack_name}.doe25.swarm.chas-lab.dev`)"
        - "traefik.http.routers.${stack_name}-api-https.entrypoints=https"
        - "traefik.http.routers.${stack_name}-api-https.tls=true"
        - "traefik.http.routers.${stack_name}-api-https.tls.certresolver=le"

        - "traefik.http.services.${stack_name}-api.loadbalancer.server.port=8080"

  frontend:
    image: ${CI_REGISTRY_IMAGE}/frontend:${image_tag}
    networks:
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.constraint-label=traefik-public"
        - "traefik.swarm.network=traefik-public"

        - "traefik.http.routers.${stack_name}-http.rule=Host(`${stack_name}.doe25.swarm.chas-lab.dev`)"
        - "traefik.http.routers.${stack_name}-http.entrypoints=http"
        - "traefik.http.routers.${stack_name}-http.middlewares=https-redirect"

        - "traefik.http.routers.${stack_name}-https.rule=Host(`${stack_name}.doe25.swarm.chas-lab.dev`)"
        - "traefik.http.routers.${stack_name}-https.entrypoints=https"
        - "traefik.http.routers.${stack_name}-https.tls=true"
        - "traefik.http.routers.${stack_name}-https.tls.certresolver=le"

        - "traefik.http.services.${stack_name}.loadbalancer.server.port=80"

networks:
  internal:
  traefik-public:
    external: true

volumes:
  sqlserver-data:
