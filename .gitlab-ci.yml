stages:
  - test
  - secret-detection

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

# [SV] Här har vi tagit bort reglerna för 'staging' och ersatt dem med en regel som säger att endast 'develop' får mergeas till 'main'. Allt annat stoppas.
# [EN] Ensure that only the develop branch can be merged into main.
check-merge-source:
  stage: test
  script:
    - |
      if [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" == "main" ] && [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "develop" ]; then
        echo "ERROR: Only develop can merge into main"
        exit 1
      fi
      echo "Merge source check passed"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

placeholder:
  stage: test
  script:
    - echo "Pipeline OK"
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"