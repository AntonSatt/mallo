{{- $component := "api" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gr8.fullname" (dict "Release" .Release "component" $component) }}
  labels:
    {{- include "gr8.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.api.port }}
      protocol: TCP
  selector:
    {{- include "gr8.selectorLabels" (dict "Release" .Release "component" $component) | nindent 4 }}
