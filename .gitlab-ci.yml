stages:
  - test
  - secret-detection
  - build
  - deploy
  - smoke-test

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

# Ensure exactly one pipeline per commit:
# - When an MR is open, run only the merge-request pipeline (so deploy + smoke-test
#   are part of the gate that blocks the merge button on failure).
# - When no MR is open, run the branch pipeline (so develop/main pushes deploy).
workflow:
  # Auto-cancel an older pipeline's interruptible jobs when a new commit lands,
  # so rapid pushes don't stack up full pipelines.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  NAMESPACE: doe25-group-8
  HOST_BASE: cc.k3s.chas-lab.dev

# Only develop can be merged into main
check-merge-source:
  stage: test
  interruptible: true
  script:
    - |
      if [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" == "main" ] && [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "develop" ]; then
        echo "ERROR: Only develop can merge into main"
        exit 1
      fi
      echo "Merge source check passed"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# Test stage: Frontend tests and coverage
# ---------------------------------------------------------------------------
frontend-test:
  stage: test
  interruptible: true
  # Placeholder job (only echoes). Restore image to node:20 when real Vitest/Jest tests are added.
  image: alpine:3.21
  script:
    - cd frontend/Gr8
    - echo "WARNING - No test scripts found in frontend package.json"
    - echo "Pipeline configured for testing, but waiting for Devs to implement Jest/Vitest."

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"

# ---------------------------------------------------------------------------
# Test stage: Backend tests and coverage
# ---------------------------------------------------------------------------
backend-test:
  stage: test
  interruptible: true
  # Placeholder job (only echoes). Restore image to the .NET SDK when real xUnit/NUnit tests are added.
  image: alpine:3.21
  script:
    - cd backend/Gr8
    - echo "WARNING - No test projects found in backend."
    - echo "Pipeline configured for testing, but waiting for Devs to implement xUnit/NUnit tests."

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"

# ---------------------------------------------------------------------------
# Build stage: build images, push to GitLab Container Registry with buildx cache
# ---------------------------------------------------------------------------

.build-image: &build-image
  stage: build
  image: docker:29
  interruptible: true
  services:
    - docker:29-dind
  before_script:
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker buildx create --use --name builder --driver docker-container || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build frontend:
  <<: *build-image
  script:
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then TAG=latest; else TAG=$CI_COMMIT_REF_SLUG; fi
      docker buildx build \
        -f frontend/Gr8/Dockerfile \
        -t "$CI_REGISTRY_IMAGE/frontend:$TAG" \
        --build-arg VITE_API_BASE_URL="/api" \
        --build-arg VITE_MAPBOX_TOKEN="$VITE_MAPBOX_TOKEN" \
        --cache-from=type=registry,ref="$CI_REGISTRY_IMAGE/frontend:cache-$TAG" \
        --cache-from=type=registry,ref="$CI_REGISTRY_IMAGE/frontend:cache-latest" \
        --cache-to=type=registry,ref="$CI_REGISTRY_IMAGE/frontend:cache-$TAG",mode=max \
        --provenance=false --push frontend/Gr8

build backend:
  <<: *build-image
  script:
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then TAG=latest; else TAG=$CI_COMMIT_REF_SLUG; fi
      docker buildx build \
        -f backend/Gr8/Dockerfile \
        -t "$CI_REGISTRY_IMAGE/backend:$TAG" \
        --cache-from=type=registry,ref="$CI_REGISTRY_IMAGE/backend:cache-$TAG" \
        --cache-from=type=registry,ref="$CI_REGISTRY_IMAGE/backend:cache-latest" \
        --cache-to=type=registry,ref="$CI_REGISTRY_IMAGE/backend:cache-$TAG",mode=max \
        --provenance=false --push backend/Gr8

# ---------------------------------------------------------------------------
# Deploy stage: plain manifests (api/frontend/db/ingress/middleware) +
# slim chart for the parts Anton doesn't own (Bitnami Redis + observability).
# Auth via KUBECONFIG_CC_PROJECT_B64 (base64 CI variable holding the kubeconfig).
# ---------------------------------------------------------------------------

.deploy-k3s: &deploy-k3s
  stage: deploy
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  before_script:
    - apk add --no-cache curl bash coreutils
    - curl -LO "https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - echo "$KUBECONFIG_CC_PROJECT_B64" | base64 -d > /tmp/kubeconfig
    - chmod 600 /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - kubectl auth whoami
    - helm dependency update ./devops/k8s/chart

# Develop deploy: persistent shared dev environment
deploy develop:
  <<: *deploy-k3s
  resource_group: develop
  needs:
    - job: build frontend
    - job: build backend
  environment:
    name: develop
    url: https://gr8-develop.${HOST_BASE}
  script:
    # Rewrite the "gr8-plain" identifier in the checked-in plain manifests to
    # "gr8-develop" so develop's resources don't collide with main's on the
    # same cluster. Image tags already match (:develop), no image rewrite.
    - sed -i 's|gr8-plain|gr8-develop|g' devops/k8s/manifests/*.yaml
    - kubectl apply -f devops/k8s/manifests/
    # kubectl apply is a no-op when the manifest spec is byte-identical to the
    # live resource (e.g. when only the image *contents* changed under the same
    # :develop tag). Force a rollout so the api+frontend pods actually pull the
    # new image. DB StatefulSet is excluded — restarting MSSQL costs ~3-4 min
    # of schema upgrade and the DB image rarely changes.
    - kubectl -n "$NAMESPACE" rollout restart deployment -l app.kubernetes.io/instance=gr8-develop
    - |
      helm upgrade --install gr8-develop-extras ./devops/k8s/chart \
        --namespace "$NAMESPACE" \
        --wait --timeout 5m --atomic
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# Production deploy: only on main, manual approval gate
deploy production:
  <<: *deploy-k3s
  resource_group: production
  needs:
    - job: build frontend
    - job: build backend
  environment:
    name: production
    url: https://gr8-main.${HOST_BASE}
  script:
    # Rewrite plain → main, develop image tags → latest, and bump api
    # request cpu (main only — develop stays cheap, no real traffic).
    - sed -i 's|gr8-plain|gr8-main|g; s|backend:develop|backend:latest|g; s|frontend:develop|frontend:latest|g; s|cpu: 25m|cpu: 300m|' devops/k8s/manifests/*.yaml
    - kubectl apply -f devops/k8s/manifests/
    - kubectl -n "$NAMESPACE" rollout restart deployment -l app.kubernetes.io/instance=gr8-main
    - |
      helm upgrade --install gr8-main-extras ./devops/k8s/chart \
        --namespace "$NAMESPACE" \
        --wait --timeout 5m --atomic
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# ---------------------------------------------------------------------------
# Smoke test: verify the deployed api actually responds.
# If the api boots, the database was reachable and migrations applied —
# so a green smoke test proves the full DB + app startup path end-to-end.
# Treats "any HTTP response from the app" as success (200, 404, etc.) so
# the check works regardless of ASPNETCORE_ENVIRONMENT. Only Traefik
# gateway errors (502/503/504) and connection failures count as down.
# ---------------------------------------------------------------------------

.smoke-test: &smoke-test
  stage: smoke-test
  image: curlimages/curl:latest
  interruptible: true
  script:
    - |
      URL="${CI_ENVIRONMENT_URL}/api/openapi/v1.json"
      echo "Polling $URL"
      # 60 * 5s = 5 min. Covers MSSQL master/msdb/model schema upgrade
      # (~3-4 min on cold-start after PVC reattach) + .NET boot + image pull.
      for i in $(seq 1 60); do
        status=$(curl -o /dev/null -s -w "%{http_code}" --max-time 5 "$URL" || echo "000")
        case "$status" in
          000|502|503|504)
            echo "attempt $i: app not responding (status $status)"
            sleep 5
            ;;
          *)
            echo "API up (HTTP $status) — DB + migrations + boot OK"
            exit 0
            ;;
        esac
      done
      echo "API never responded within 300s — check api/db logs with kubectl"
      exit 1

smoke-test develop:
  <<: *smoke-test
  needs:
    - job: deploy develop
  environment:
    name: develop
    action: verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

smoke-test production:
  <<: *smoke-test
  needs:
    - job: deploy production
  environment:
    name: production
    action: verify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
