apiVersion: v1
kind: Service
metadata:
  name: gr8-plain-db
  labels:
    app.kubernetes.io/name: gr8
    app.kubernetes.io/instance: gr8-plain
    app.kubernetes.io/part-of: gr8
    app.kubernetes.io/component: db
spec:
  # Headless: the StatefulSet's stable pod DNS (gr8-plain-db) is what the api
  # connects to. No load-balancing needed for a single MSSQL pod.
  clusterIP: None
  ports:
    - name: mssql
      port: 1433
      targetPort: 1433
      protocol: TCP
  selector:
    app.kubernetes.io/name: gr8
    app.kubernetes.io/instance: gr8-plain
    app.kubernetes.io/component: db
